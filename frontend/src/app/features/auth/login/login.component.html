<div
  class="min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8"
>
  <div class="max-w-md w-full space-y-8">
    <div>
      <h2 class="mt-6 text-center text-3xl font-extrabold">Iniciar Sesión</h2>
      <p class="mt-2 text-center text-sm">
        Ingresa tus credenciales para continuar
      </p>
    </div>

    <p-card styleClass="shadow-lg">
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-6">
        <div>
          <label for="email" class="block text-sm font-medium mb-2">
            Email
          </label>
          <input
            pInputText
            id="email"
            formControlName="email"
            type="email"
            placeholder="tu@email.com"
            class="w-full"
            [class.ng-invalid]="email?.invalid && email?.touched"
            [class.ng-dirty]="email?.touched"
          />
          <small
            *ngIf="email?.invalid && email?.touched"
            class="text-red-400 block mt-1"
          >
            <span *ngIf="email?.errors?.['required']"
              >El email es requerido</span
            >
            <span *ngIf="email?.errors?.['email']"
              >Ingresa un email válido</span
            >
          </small>
        </div>

        <div>
          <label for="password" class="block text-sm font-medium mb-2">
            Contraseña
          </label>
          <p-password
            id="password"
            formControlName="password"
            [toggleMask]="true"
            [feedback]="false"
            placeholder="••••••••"
            styleClass="w-full"
            inputStyleClass="w-full"
            [class.ng-invalid]="password?.invalid && password?.touched"
            [class.ng-dirty]="password?.touched"
          ></p-password>
          <small
            *ngIf="password?.invalid && password?.touched"
            class="text-red-400 block mt-1"
          >
            <span *ngIf="password?.errors?.['required']"
              >La contraseña es requerida</span
            >
            <span *ngIf="password?.errors?.['minlength']"
              >Mínimo 6 caracteres</span
            >
          </small>
        </div>

        <div>
          <p-button
            type="submit"
            label="Iniciar Sesión"
            icon="pi pi-sign-in"
            [loading]="loading"
            styleClass="w-full"
            [disabled]="loading"
          ></p-button>
        </div>
      </form>
    </p-card>

    <div class="text-center">
      <p class="text-sm">
        ¿No tienes cuenta?
        <a
          routerLink="/register"
          class="text-primary-500 font-medium hover:text-primary-400"
          >Regístrate aquí</a
        >
      </p>
    </div>
  </div>
</div>
